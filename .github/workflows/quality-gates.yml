name: Quality gates

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-gates-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  RUBY_VERSION: "3.4"

jobs:
  python-package:
    name: Python package installation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: python/pyproject.toml
      - name: Install package and development dependencies
        run: python -m pip install './python[dev]'
      - name: Exercise installed entry point outside the source directory
        working-directory: /tmp
        run: biblegamecard version

  python-tests:
    name: Python unit, integration, and contract tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: python/pyproject.toml
      - run: python -m pip install './python[test]'
      - name: Run Python tests
        working-directory: python
        run: python -m pytest

  python-quality:
    name: Ruff formatting, Ruff linting, and MyPy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: python/pyproject.toml
      - run: python -m pip install './python[dev]'
      - name: Check formatting
        working-directory: python
        run: ruff format --check .
      - name: Lint
        working-directory: python
        run: ruff check .
      - name: Type check
        working-directory: python
        run: mypy

  ruby-tests:
    name: Ruby regression tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: ruby/setup-ruby@v1.207.0
        with:
          ruby-version: ${{ env.RUBY_VERSION }}
          bundler-cache: true
      - run: bundle exec ruby -Itest test/validate_character_knowledge_test.rb
      - run: bundle exec ruby -Itest test/legendary_prompt_development_tools_test.rb
      - run: bundle exec ruby -Itest test/prompt_compilation_test.rb

  canonical-validation:
    name: Canonical package validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: ruby/setup-ruby@v1.207.0
        with:
          ruby-version: ${{ env.RUBY_VERSION }}
          bundler-cache: true
      - run: bundle exec ruby tools/validate_character_knowledge.rb --all

  assembly-drift:
    name: Deterministic assembly drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: ruby/setup-ruby@v1.207.0
        with:
          ruby-version: ${{ env.RUBY_VERSION }}
          bundler-cache: true
      - run: bundle exec ruby tools/assemble_character_knowledge.rb --check --all
      - name: Assert tracked files remain clean
        run: test -z "$(git status --porcelain --untracked-files=no)"

  prompt-development:
    name: Legendary prompt development and readiness drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: ruby/setup-ruby@v1.207.0
        with:
          ruby-version: ${{ env.RUBY_VERSION }}
          bundler-cache: true
      - run: bundle exec ruby tools/validate_legendary_prompt_development.rb --all
      - run: bundle exec ruby tools/report_legendary_generation_readiness.rb --check
      - name: Assert tracked files remain clean
        run: test -z "$(git status --porcelain --untracked-files=no)"

  prompt-compiler:
    name: Prompt compilation tests and generated-prompt drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: ruby/setup-ruby@v1.207.0
        with:
          ruby-version: ${{ env.RUBY_VERSION }}
          bundler-cache: true
      - run: bundle exec ruby -Itest test/prompt_compilation_test.rb
      - name: Verify prompt compiler write/check determinism outside the checkout
        run: |
          output="$(mktemp -d)"
          trap 'rm -rf "$output"' EXIT
          bundle exec ruby tools/compile_prompts.rb --all --output "$output"
          bundle exec ruby tools/compile_prompts.rb --all --output "$output" --check
      - name: Assert tracked files remain clean
        run: test -z "$(git status --porcelain --untracked-files=no)"
