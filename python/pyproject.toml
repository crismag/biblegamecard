[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "biblegamecard"
version = "0.1.0"
description = "Python application foundation for the BibleGameCard production repository"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "All rights reserved" }
authors = [{ name = "BibleGameCard contributors" }]
dependencies = []

[project.scripts]
biblegamecard = "biblegamecard.cli:main"

[project.optional-dependencies]
test = ["pytest>=8.0"]
dev = ["mypy>=1.10", "pytest>=8.0", "ruff>=0.5"]

[dependency-groups]
test = ["pytest>=8.0"]
dev = ["mypy>=1.10", "pytest>=8.0", "ruff>=0.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
